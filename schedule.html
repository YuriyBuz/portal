<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Графік та заявки | Портал працівника</title>
    <meta name="theme-color" content="#059669">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
    <style>
        body { background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .dark body { background-color: #0f172a; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
        .day-header { text-align: center; font-size: 0.875rem; font-weight: 600; padding: 4px 0; }
        .calendar-day { 
            aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; 
            justify-content: center; border-radius: 0.5rem; border: 1px solid #e2e8f0; 
            cursor: pointer; transition: all 0.2s; position: relative;
        }
        .dark .calendar-day { border-color: #334155; }
        .calendar-day:hover { border-color: #10b981; transform: scale(1.05); z-index: 10; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .calendar-day.today { border-color: #10b981; border-width: 2px; font-weight: bold; }
        .calendar-day.selected { background-color: #10b981; color: white; border-color: #10b981; }
        .calendar-day.empty { background-color: transparent; border-color: transparent; cursor: default; }
        .calendar-day.empty:hover { transform: none; box-shadow: none; border-color: transparent; }
    </style>
</head>
<body class="font-sans text-slate-800 dark:text-slate-200 antialiased min-h-screen flex flex-col transition-colors duration-200">

    <!-- Верхня панель навігації -->
    <nav class="bg-white dark:bg-slate-800 shadow-sm border-b border-slate-200 dark:border-slate-700 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-4">
                    <a href="index.html" class="text-slate-500 dark:text-slate-400 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors flex items-center gap-1 font-medium bg-slate-50 dark:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-100 dark:border-slate-600">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                        </svg>
                        <span class="hidden sm:inline">Назад</span>
                    </a>
                    <h1 class="text-lg font-bold text-slate-800 dark:text-white truncate">Мій графік</h1>
                </div>
                <div class="flex items-center gap-3">
                    <button id="theme-toggle" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-amber-400 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    </button>
                    <div class="text-sm font-medium bg-emerald-50 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 px-3 py-1.5 rounded-full border border-emerald-100 dark:border-emerald-800 flex items-center gap-2 shadow-sm">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span id="user-name" class="truncate max-w-[120px] sm:max-w-[200px]">...</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-6xl mx-auto w-full px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Ліва колонка: Календар -->
            <div class="lg:col-span-2">
                <section class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold text-slate-800 dark:text-white" id="current-month-year">...</h2>
                        <div class="flex gap-2">
                            <button id="prev-month" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg></button>
                            <button id="next-month" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg></button>
                        </div>
                    </div>
                    
                    <div class="calendar-grid mb-2 text-slate-500 dark:text-slate-400">
                        <div class="day-header">Пн</div>
                        <div class="day-header">Вв</div>
                        <div class="day-header">Ср</div>
                        <div class="day-header">Чт</div>
                        <div class="day-header">Пт</div>
                        <div class="day-header text-red-400">Сб</div>
                        <div class="day-header text-red-400">Нд</div>
                    </div>
                    
                    <div id="calendar-days" class="calendar-grid">
                        <!-- Дні генеруватимуться через JS -->
                    </div>
                </section>
            </div>

            <!-- Права колонка: Форма + Історія -->
            <div class="space-y-6">
                
                <!-- Форма заявки (схована до вибору дати) -->
                <section id="shift-form-section" class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden hidden">
                    <div class="bg-emerald-50 dark:bg-emerald-900/30 p-4 border-b border-emerald-100 dark:border-emerald-800">
                        <h3 class="font-bold text-slate-800 dark:text-white flex items-center gap-2">
                            <svg class="w-5 h-5 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                            Заявка на <span id="selected-date-text" class="text-emerald-600 dark:text-emerald-400">...</span>
                        </h3>
                    </div>
                    <form id="shift-form" class="p-5 space-y-4">
                        <div id="shift-form-inputs" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Тип зміни</label>
                                <select id="shift-type" required class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500">
                                    <option value="" disabled selected>Оберіть...</option>
                                    <option value="День">День</option>
                                    <option value="Ніч">Ніч</option>
                                    <option value="Підробіток">Підробіток (кілька годин)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Коментар</label>
                                <textarea id="shift-comment" rows="2" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500 resize-none"></textarea>
                            </div>
                        </div>

                        <div id="success-message" class="hidden text-sm text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-900/30 p-3 rounded-lg border border-emerald-200 dark:border-emerald-800 text-center font-medium">
                            Заявку відправлено керівнику!
                        </div>

                        <div id="shift-form-actions">
                            <button type="submit" id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg transition-colors flex justify-center items-center gap-2">
                                <span>Відправити</span>
                                <svg id="submit-spinner" class="animate-spin h-4 w-4 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                            </button>
                        </div>
                    </form>
                </section>

                <!-- Історія заявок -->
                <section class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col h-[400px]">
                    <div class="p-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800/50">
                        <h2 class="font-bold text-slate-800 dark:text-white flex items-center gap-2">
                            <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                            Мої заявки
                        </h2>
                        <!-- Кнопка ручного оновлення -->
                        <button onclick="loadMyRequestsOnline()" class="flex items-center gap-1 text-xs font-bold text-emerald-600 dark:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-emerald-900/30 px-2 py-1.5 rounded-md transition-colors border border-emerald-200 dark:border-emerald-800" title="Оновити список">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3 h-3"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>
                            Оновити
                        </button>
                    </div>
                    
                    <div class="p-4 overflow-y-auto flex-grow bg-slate-50/50 dark:bg-slate-800/20">
                        <div id="requests-loading" class="flex justify-center items-center py-6">
                            <svg class="animate-spin h-6 w-6 text-emerald-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        </div>
                        <div id="requests-list" class="space-y-2 hidden">
                            <!-- Заявки завантажуватимуться сюди -->
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script>
        const LOG_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxTLPe1ucmGBj64hHeyUkLVts_ZdMzneb-aXkeRpCg2FnpqoPhtgtyOyptMSbh0Cx_TEA/exec';
        
        let currentDate = new Date();
        let selectedDateStr = null;

        document.addEventListener('DOMContentLoaded', () => {
            const currentUser = sessionStorage.getItem('portal_user');
            
            // Перевірка авторизації
            if (!currentUser) {
                document.body.innerHTML = `
                    <div class="min-h-screen flex items-center justify-center p-4 bg-slate-50 dark:bg-slate-900">
                        <div class="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-xl text-center max-w-sm w-full border border-slate-200 dark:border-slate-700">
                            <h2 class="text-xl font-bold mb-2 text-slate-800 dark:text-white">Помилка доступу</h2>
                            <p class="text-slate-500 dark:text-slate-400 mb-6">Авторизуйтесь для доступу.</p>
                            <a href="index.html" class="inline-block w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition-colors shadow-md">До входу</a>
                        </div>
                    </div>`;
                return;
            }
            
            document.getElementById('user-name').textContent = currentUser;

            // Налаштування теми
            const themeBtn = document.getElementById('theme-toggle');
            themeBtn.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                localStorage.setItem('color-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            });

            // Календар
            const monthYearEl = document.getElementById('current-month-year');
            const calendarDaysEl = document.getElementById('calendar-days');
            const ukrMonths = ["Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень", "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"];

            function renderCalendar() {
                calendarDaysEl.innerHTML = '';
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                
                monthYearEl.textContent = `${ukrMonths[month]} ${year}`;
                
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const startDay = firstDay === 0 ? 6 : firstDay - 1; // Пн - 0, Нд - 6
                
                const today = new Date();
                
                // Пусті клітинки до першого дня
                for (let i = 0; i < startDay; i++) {
                    const emptyDiv = document.createElement('div');
                    emptyDiv.className = 'calendar-day empty';
                    calendarDaysEl.appendChild(emptyDiv);
                }
                
                // Дні місяця
                for (let i = 1; i <= daysInMonth; i++) {
                    const dayDiv = document.createElement('div');
                    dayDiv.className = 'calendar-day bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-200 font-medium';
                    dayDiv.textContent = i;
                    
                    const cellDateStr = `${String(i).padStart(2, '0')}.${String(month + 1).padStart(2, '0')}.${year}`;
                    dayDiv.dataset.date = cellDateStr;
                    
                    if (year === today.getFullYear() && month === today.getMonth() && i === today.getDate()) {
                        dayDiv.classList.add('today');
                    }
                    
                    // Клік по дню
                    dayDiv.addEventListener('click', () => {
                        // Не даємо подати заявку на минулі дні
                        const cellDateObj = new Date(year, month, i);
                        const todayObj = new Date(today.getFullYear(), today.getMonth(), today.getDate());
                        if (cellDateObj < todayObj) {
                            alert("Неможливо подати заявку на минулу дату.");
                            return;
                        }

                        document.querySelectorAll('.calendar-day').forEach(d => d.classList.remove('selected'));
                        dayDiv.classList.add('selected');
                        
                        selectedDateStr = cellDateStr;
                        document.getElementById('selected-date-text').textContent = cellDateStr;
                        document.getElementById('shift-form-section').classList.remove('hidden');
                        
                        // Скидаємо форму
                        document.getElementById('shift-form').reset();
                        document.getElementById('shift-form-inputs').classList.remove('hidden');
                        document.getElementById('shift-form-actions').classList.remove('hidden');
                        document.getElementById('success-message').classList.add('hidden');
                    });
                    
                    calendarDaysEl.appendChild(dayDiv);
                }
            }

            document.getElementById('prev-month').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderCalendar();
            });
            
            document.getElementById('next-month').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderCalendar();
            });

            renderCalendar();

            // Логування
            function logUserAction(action) {
                const formData = new FormData();
                formData.append('user', currentUser);
                formData.append('action', action);
                fetch(LOG_SCRIPT_URL, { method: 'POST', body: formData, mode: 'no-cors' }).catch(()=>{});
            }
            logUserAction("Переглядає свій графік");

            // Обробка форми
            const form = document.getElementById('shift-form');
            const sBtn = document.getElementById('submit-btn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!selectedDateStr) return;
                
                const tVal = document.getElementById('shift-type').value;
                const cVal = document.getElementById('shift-comment').value;
                if(!tVal) return;

                sBtn.disabled = true;
                document.getElementById('submit-spinner').classList.remove('hidden');

                try {
                    logUserAction(`Відправка заявки на зміну: ${selectedDateStr}`);

                    // Відправляємо JSON запит для створення заявки
                    await fetch(LOG_SCRIPT_URL, { 
                        method: 'POST', 
                        body: JSON.stringify({ 
                            requestType: 'submit_request',
                            user: currentUser, 
                            date: selectedDateStr, 
                            type: tVal, 
                            comment: cVal || 'немає'
                        }), 
                        mode: 'no-cors' 
                    });

                    // Завантажуємо оновлені дані з бази
                    await loadMyRequestsOnline();

                    document.getElementById('shift-form-inputs').classList.add('hidden');
                    document.getElementById('shift-form-actions').classList.add('hidden');
                    document.getElementById('success-message').classList.remove('hidden');
                } catch(err) { 
                    alert('Помилка при відправленні запиту.'); 
                } finally { 
                    sBtn.disabled = false; 
                    document.getElementById('submit-spinner').classList.add('hidden'); 
                }
            });

            // Запускаємо відразу при завантаженні графіку
            loadMyRequestsOnline();
            // Ставимо інтервал оновлення (10 хв)
            setInterval(loadMyRequestsOnline, 600000);
        });

        // НОВА ФУНКЦІЯ: Завантаження заявок онлайн
        async function loadMyRequestsOnline() {
            const currentUser = sessionStorage.getItem('portal_user');
            if (!currentUser) return;
            
            const list = document.getElementById('requests-list');
            const loading = document.getElementById('requests-loading');
            
            try {
                const res = await fetch(LOG_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ requestType: 'get_my_requests', user: currentUser })
                });
                
                const onlineReqs = await res.json();
                
                loading.classList.add('hidden');
                list.classList.remove('hidden');

                if (onlineReqs.length === 0) {
                    list.innerHTML = `<p class="text-sm text-slate-500 dark:text-slate-400 text-center py-4">Ви ще не подавали заявок.</p>`;
                } else {
                    list.innerHTML = onlineReqs.map(r => {
                        let statusColor = r.status === 'Погоджено' ? 'text-emerald-600 bg-emerald-50 border-emerald-200 dark:bg-emerald-900/30 dark:border-emerald-800' : 
                                          (r.status === 'Відхилено' ? 'text-red-500 bg-red-50 border-red-200 dark:bg-red-900/30 dark:border-red-800' : 'text-amber-500 bg-amber-50 border-amber-200 dark:bg-amber-900/30 dark:border-amber-800');
                        
                        // Безпечне форматування дати
                        let displayDate = r.date;
                        if (typeof displayDate === 'string' && displayDate.includes('T')) {
                            const d = new Date(displayDate);
                            displayDate = `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${d.getFullYear()}`;
                        }

                        return `
                        <div class="flex justify-between items-center p-3 mb-2 bg-white dark:bg-slate-700 rounded-xl shadow-sm border border-slate-100 dark:border-slate-600">
                            <div>
                                <p class="font-bold text-sm text-slate-800 dark:text-white">${displayDate}</p>
                                <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">${r.type}</p>
                            </div>
                            <span class="text-[10px] font-bold px-2 py-1 rounded-md border ${statusColor}">${r.status}</span>
                        </div>
                    `}).join('');
                }
            } catch (e) {
                console.error("Помилка завантаження заявок", e);
                loading.classList.add('hidden');
                list.classList.remove('hidden');
                list.innerHTML = `<p class="text-sm text-red-500 text-center py-4">Помилка з'єднання.</p>`;
            }
        }
    </script>
</body>
</html>
