<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Графік та заявки | Портал</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .day-cell { height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid #e2e8f0; }
        .shift-day { background-color: #059669; color: white; border-radius: 8px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4">
    <div class="max-w-4xl mx-auto">
        <a href="./index.html" class="text-emerald-600 font-bold mb-6 block">← Назад на портал</a>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8">
            <h2 class="text-xl font-bold mb-4 text-slate-800">Календар змін</h2>
            <div id="calendar-container" class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Календарі генеруються через JS -->
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8">
            <h2 class="text-lg font-bold mb-4 text-slate-800">Подати заявку на зміну</h2>
            <form id="request-form" class="space-y-4">
                <input type="date" id="req-date" class="w-full p-3 border rounded-lg" required>
                <textarea id="req-comment" placeholder="Коментар" class="w-full p-3 border rounded-lg"></textarea>
                <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-lg hover:bg-emerald-700">Відправити заявку</button>
            </form>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold mb-4">Повний графік</h2>
            <a href="https://docs.google.com/spreadsheets/d/1uL5lkZGPk8klJku5dX-eh075aZhFSUTeyIdDHLAQuKg/edit" target="_blank" class="block text-center bg-slate-100 py-3 rounded-lg hover:bg-slate-200">Відкрити таблицю</a>
        </div>
    </div>

    <script>
        document.getElementById('request-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                to: ["Buznitskiy7@gmail.com", "dyndarnastia@gmail.com"],
                subject: "Заявка на додаткову зміну",
                body: `Працівник: ${sessionStorage.getItem('portal_user')}\nДата: ${document.getElementById('req-date').value}\nКоментар: ${document.getElementById('req-comment').value}`
            };
            
            const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzh4S5Hq1p6NZ5iGL5PmeEJ0XNkkwc0ZdFW-geez9kZlgxu0Xwp8w13tv-Abgf0LPdP/exec'; // Вставте сюди посилання на ваш скрипт
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data), mode: 'no-cors' });
            alert("Заявка відправлена!");
        });
    </script>
</body>
</html>
