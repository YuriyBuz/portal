<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Графік | Портал</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
        if (localStorage.getItem('color-theme') === 'dark' || window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 transition-colors">
    <div class="max-w-7xl mx-auto p-4 sm:p-6">
        <a href="./index.html" class="text-emerald-600 font-bold mb-4 inline-block">← Назад</a>
        
        <div id="calendar-loader" class="text-center py-10 text-slate-500">Завантаження графіка...</div>
        
        <div id="calendars-wrapper" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </div>

    <script>
        const currentUser = sessionStorage.getItem('portal_user');
        // Посилання на ваш CSV-експорт (це працює набагато надійніше за JSON)
        const SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/1uL5lkZGPk8klJku5dX-eh075aZhFSUTeyIdDHLAQuKg/export?format=csv&gid=1460425356`;

        async function loadSchedule() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const text = await response.text();
                const rows = text.split('\n').map(row => row.split(',').map(cell => cell.trim().replace(/^"|"$/g, '')));
                
                // Знаходимо рядок користувача
                const userRow = rows.find(r => r[0] && r[0].toLowerCase().includes(currentUser.toLowerCase().split(' ')[0]));
                
                if (!userRow) {
                    document.getElementById('calendar-loader').textContent = "Вас не знайдено у графіку.";
                    return;
                }

                document.getElementById('calendar-loader').classList.add('hidden');
                renderCalendar(userRow);
            } catch (e) {
                document.getElementById('calendar-loader').textContent = "Помилка завантаження. Перевірте доступ до таблиці.";
            }
        }

        function renderCalendar(userRow) {
            const wrapper = document.getElementById('calendars-wrapper');
            // Приклад того, як ми беремо дані: 
            // userRow[2] - це колонка C (перший день місяця)
            // userRow[3] - це колонка D (ніч першого дня)
            
            let html = '<div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow">';
            for (let i = 1; i <= 31; i++) {
                // Розраховуємо індекси CSV (враховуючи, що ПІБ-колонки це 0 і 1)
                const dayVal = userRow[2 + (i-1)*2] || '';
                const nightVal = userRow[3 + (i-1)*2] || '';
                
                // Всі ці літери (В, Л, 1, З) тепер точно потраплять сюди
                const display = dayVal || nightVal || '';
                
                html += `
                    <div class="border p-2 rounded ${display === 'В' ? 'bg-amber-200' : display === 'Л' ? 'bg-blue-200' : 'bg-white'}">
                        <span class="text-xs">${i}</span>
                        <div class="font-bold">${display}</div>
                    </div>
                `;
            }
            html += '</div>';
            wrapper.innerHTML = html;
        }

        loadSchedule();
    </script>
</body>
</html>
