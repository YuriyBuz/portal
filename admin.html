<!-- Оновлений блок таблиці -->
<div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 w-full max-w-7xl mx-auto overflow-hidden">
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse mx-auto">
            <thead id="sched-head" class="bg-slate-100 dark:bg-slate-700/90 text-slate-600 dark:text-slate-300 border-b border-slate-300 dark:border-slate-600"></thead>
            <tbody id="sched-body" class="bg-white dark:bg-slate-800"></tbody>
        </table>
    </div>
</div>

<script>
// Оновлена функція рендерингу для коректної верстки
function renderScheduleTable(data, mYear) {
    const ukrMonths = ["Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень", "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"];
    const monthIndex = ukrMonths.indexOf(mYear.split(' ')[0]);
    const yearStr = parseInt(mYear.split(' ')[1]);
    let daysInMonth = new Date(yearStr, monthIndex + 1, 0).getDate();

    let headHtml = `<tr>
        <th class="w-4 bg-slate-100 dark:bg-slate-700/90"></th>
        <th class="px-2 py-2 sticky left-0 z-[40] bg-slate-100 dark:bg-slate-700/90 min-w-[150px] text-left border-r border-slate-300 dark:border-slate-600 text-[10px] uppercase font-black">ПІБ Працівника</th>`;
    
    for(let d=1; d<=daysInMonth; d++) {
        let dayOfWeek = new Date(yearStr, monthIndex, d).getDay();
        let dayName = ['Нд', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'][dayOfWeek];
        headHtml += `<th class="px-1 py-1 text-center border-l border-slate-300 dark:border-slate-600 min-w-[30px] font-medium leading-tight">
            <div class="text-[11px] font-black text-slate-800 dark:text-white">${d}</div>
            <div class="text-[8px] ${[0,6].includes(dayOfWeek) ? 'text-red-500' : 'text-slate-400'}">${dayName}</div>
        </th>`;
    }
    headHtml += `<th class="px-2 py-1 text-center border-l border-slate-300 dark:border-slate-600 text-[10px] font-bold">Сума</th>
        <th class="w-4 bg-slate-100 dark:bg-slate-700/90"></th></tr>`;
    
    document.getElementById('sched-head').innerHTML = headHtml;

    document.getElementById('sched-body').innerHTML = data.map((emp, index) => {
        let rowHtml = `<tr class="border-b border-slate-100 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/30">
            <td class="bg-white dark:bg-slate-800"></td>
            <td class="px-2 py-1 sticky left-0 z-[30] bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 font-bold text-[11px] truncate cursor-pointer hover:text-emerald-600" onclick="showEmpModal('${emp.name.replace(/'/g, "\\'")}', '${(emp.position || '').replace(/'/g, "\\'")}')">
                ${formatShortName(emp.name)}
            </td>`;
        
        emp.schedule.forEach(day => {
            if(day.day > daysInMonth) return;
            rowHtml += `<td class="border-l border-slate-100 dark:border-slate-700 p-0 text-center cursor-pointer hover:bg-emerald-50 dark:hover:bg-emerald-900/20 text-[10px] font-bold" onclick="editCell('${emp.name.replace(/'/g, "\\'")}', ${day.day})">
                ${day.dVal || ''}
            </td>`;
        });

        rowHtml += `<td class="text-center font-black text-[11px] border-l border-slate-200 dark:border-slate-700"></td>
            <td class="bg-white dark:bg-slate-800"></td></tr>`;
        return rowHtml;
    }).join('');
}
</script>
