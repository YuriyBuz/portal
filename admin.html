<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель керівника | Foodline</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800">

    <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm text-center">
            <h2 class="text-2xl font-bold mb-6">Вхід в Кабінет</h2>
            <input type="password" id="admin-pass" placeholder="Пароль" class="w-full p-3 border rounded-lg mb-4 outline-none focus:ring-2 focus:ring-emerald-500 text-center text-2xl tracking-widest">
            <button onclick="checkPass()" class="w-full bg-slate-800 text-white py-3 rounded-lg font-bold hover:bg-slate-900 transition">Увійти</button>
            <p id="error" class="text-red-500 mt-4 hidden">Невірний пароль</p>
        </div>
    </div>

    <div id="admin-content" class="hidden">
        <nav class="bg-white border-b p-4 sticky top-0 z-50 shadow-sm">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <h1 class="font-bold text-xl text-emerald-700">📊 Панель управління Foodline</h1>
                <a href="index.html" class="text-slate-500 hover:text-emerald-600 font-medium">← На портал</a>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto p-4 sm:p-8 space-y-8">
            
            <section class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                <div class="p-6 bg-emerald-50 border-b">
                    <h2 class="text-lg font-bold text-emerald-800">⏳ Заявки на додаткові зміни</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left whitespace-nowrap">
                        <thead class="bg-slate-50 text-slate-500 text-xs uppercase">
                            <tr>
                                <th class="p-4">Працівник</th>
                                <th class="p-4">Дата</th>
                                <th class="p-4">Зміна</th>
                                <th class="p-4">Коментар</th>
                                <th class="p-4 text-center">Дія</th>
                            </tr>
                        </thead>
                        <tbody id="req-table" class="divide-y text-sm">
                            </tbody>
                    </table>
                </div>
            </section>

            <section class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                <div class="p-6 bg-blue-50 border-b flex flex-col sm:flex-row justify-between items-center gap-4">
                    <h2 class="text-lg font-bold text-blue-800">📈 Статистика за місяць</h2>
                    <select id="month-select" onchange="loadStats()" class="p-2 border border-slate-300 rounded-lg text-sm bg-white outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="Травень 2024">Травень 2024</option>
                        <option value="Червень 2024">Червень 2024</option>
                        <option value="Липень 2024">Липень 2024</option>
                        <option value="Серпень 2024">Серпень 2024</option>
                    </select>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left whitespace-nowrap">
                        <thead class="bg-slate-50 text-slate-500 text-xs uppercase">
                            <tr>
                                <th class="p-4">ПІБ</th>
                                <th class="p-4">Змін за планом</th>
                                <th class="p-4">Додаткових (З)</th>
                                <th class="p-4">Лікарняні</th>
                                <th class="p-4">Відпустки</th>
                                <th class="p-4">Залишок відпустки</th>
                            </tr>
                        </thead>
                        <tbody id="stats-table" class="divide-y text-sm">
                             </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwvkGTwNAiJ-FBkge75yy4uEUDw1HVW-P6B4InvjwS3PaNrUl3fiKgEtIFPeBVralh6Xw/exec';

        // ОНОВЛЕНО: Автоматичний вхід, якщо пароль було успішно введено на головній сторінці при кліку на лого
        document.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('admin_auth') === 'true') {
                document.getElementById('admin-pass').value = '8899';
                checkPass();
            }
        });

        // Логіка перевірки пароля
        function checkPass() {
            const pass = document.getElementById('admin-pass').value;
            if(pass === '8899') {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
                loadStats();
            } else {
                document.getElementById('error').classList.remove('hidden');
            }
        }

        // Обробка натискання Enter у полі вводу пароля
        document.getElementById('admin-pass').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkPass();
        });

        // Завантаження даних з Google Таблиці
        async function loadStats() {
            const month = document.getElementById('month-select').value;
            try {
                const r = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ requestType: 'get_admin_data', monthYear: month })
                });
                const data = await r.json();
                
                if (data.error) {
                    alert('Помилка: ' + data.error + '. Впевніться, що вкладка з таким місяцем існує в таблиці.');
                    return;
                }
                
                renderRequests(data.requests, month);
                renderStats(data.stats);
            } catch(e) { 
                console.error(e);
                alert("Помилка завантаження даних. Перевірте з'єднання або налаштування доступу."); 
            }
        }

        // Рендер таблиці заявок
        function renderRequests(reqs, month) {
            const tbody = document.getElementById('req-table');
            if (!reqs || reqs.length === 0 || !reqs.some(r => r[5] === 'Очікує')) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-slate-500">Немає нових заявок, що очікують погодження.</td></tr>';
                return;
            }

            tbody.innerHTML = reqs.filter(r => r[5] === 'Очікує').map(r => `
                <tr>
                    <td class="p-4 font-bold text-slate-700">${r[2]}</td>
                    <td class="p-4">${r[1]}</td>
                    <td class="p-4">${r[3]}</td>
                    <td class="p-4 text-slate-500 italic truncate max-w-[200px]" title="${r[4] || '-'}">${r[4] || '-'}</td>
                    <td class="p-4 flex gap-2 justify-center">
                        <button onclick="updateStatus('${r[0]}', 'Схвалено', '${r[2]}', '${r[1]}', '${month}')" class="bg-emerald-500 text-white px-3 py-1.5 rounded-lg hover:bg-emerald-600 transition shadow-sm text-sm font-medium">👍 Погодити</button>
                        <button onclick="updateStatus('${r[0]}', 'Відхилено', '${r[2]}', '${r[1]}', '${month}')" class="bg-red-500 text-white px-3 py-1.5 rounded-lg hover:bg-red-600 transition shadow-sm text-sm font-medium">👎 Відхилити</button>
                    </td>
                </tr>
            `).join('');
        }

        // Рендер таблиці статистики
        function renderStats(stats) {
            const tbody = document.getElementById('stats-table');
            if (!stats || stats.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-500">Немає даних для відображення.</td></tr>';
                return;
            }

            tbody.innerHTML = stats.map(s => `
                <tr class="hover:bg-slate-50">
                    <td class="p-4 font-medium text-slate-700">${s.name}</td>
                    <td class="p-4 text-center">${s.scheduled}</td>
                    <td class="p-4 text-center text-emerald-600 font-bold">${s.worked}</td>
                    <td class="p-4 text-center text-blue-500 font-medium">${s.sick}</td>
                    <td class="p-4 text-center text-amber-500 font-medium">${s.vac}</td>
                    <td class="p-4 text-center bg-slate-50 font-bold">${s.vacLeft} дн.</td>
                </tr>
            `).join('');
        }

        // Оновлення статусу заявки
        async function updateStatus(id, status, user, date, month) {
            if(!confirm(`Змінити статус заявки для ${user} на: ${status}?`)) return;
            
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        requestType: 'update_request_status', 
                        requestId: id, 
                        status: status,
                        userName: user,
                        date: date,
                        monthName: month
                    })
                });
                // Перезавантажуємо дані після оновлення
                loadStats();
            } catch (e) {
                alert('Виникла помилка під час оновлення статусу.');
            }
        }
    </script>
</body>
</html>
