<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін панель | Foodline</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class'
        };

        if (
            localStorage.getItem('color-theme') === 'dark' ||
            (!('color-theme' in localStorage) &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>

<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-white min-h-screen transition-colors duration-200">

    <nav class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">

            <div class="flex items-center gap-4">
                <a href="index.html"
                   class="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors text-sm font-medium">
                    ← Назад
                </a>

                <div>
                    <h1 class="text-xl font-bold">Адмін панель</h1>
                    <p class="text-sm text-slate-500 dark:text-slate-400">
                        Керування заявками працівників
                    </p>
                </div>
            </div>

            <div class="flex items-center gap-3">

                <button id="theme-toggle"
                        class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">
                    🌙
                </button>

                <button id="logout-btn"
                        class="px-4 py-2 rounded-lg bg-red-500 hover:bg-red-600 text-white font-medium transition-colors">
                    Вийти
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 md:p-6">

        <!-- Статистика -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">

            <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700 shadow-sm">
                <p class="text-sm text-slate-500 dark:text-slate-400 mb-1">Всього заявок</p>
                <h2 id="total-count" class="text-3xl font-bold">0</h2>
            </div>

            <div class="bg-amber-50 dark:bg-amber-900/20 rounded-2xl p-5 border border-amber-200 dark:border-amber-800 shadow-sm">
                <p class="text-sm text-amber-700 dark:text-amber-300 mb-1">Очікують</p>
                <h2 id="pending-count" class="text-3xl font-bold text-amber-600">0</h2>
            </div>

            <div class="bg-emerald-50 dark:bg-emerald-900/20 rounded-2xl p-5 border border-emerald-200 dark:border-emerald-800 shadow-sm">
                <p class="text-sm text-emerald-700 dark:text-emerald-300 mb-1">Погоджено</p>
                <h2 id="approved-count" class="text-3xl font-bold text-emerald-600">0</h2>
            </div>

            <div class="bg-red-50 dark:bg-red-900/20 rounded-2xl p-5 border border-red-200 dark:border-red-800 shadow-sm">
                <p class="text-sm text-red-700 dark:text-red-300 mb-1">Відхилено</p>
                <h2 id="rejected-count" class="text-3xl font-bold text-red-600">0</h2>
            </div>
        </div>


        <!-- Панель управління -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm mb-6 p-4">

            <div class="flex flex-col lg:flex-row gap-4 justify-between">

                <div class="flex flex-col sm:flex-row gap-3 flex-1">

                    <input
                        type="text"
                        id="search-input"
                        placeholder="Пошук працівника..."
                        class="flex-1 px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 outline-none focus:ring-2 focus:ring-emerald-500"
                    >

                    <select id="status-filter"
                            class="px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="all">Всі статуси</option>
                        <option value="Очікує">Очікує</option>
                        <option value="Погоджено">Погоджено</option>
                        <option value="Відхилено">Відхилено</option>
                    </select>
                </div>

                <button id="refresh-btn"
                        class="px-5 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-medium transition-colors">
                    Оновити
                </button>
            </div>
        </div>


        <!-- Завантаження -->
        <div id="loading"
             class="flex items-center justify-center py-16">

            <svg class="animate-spin h-10 w-10 text-emerald-500"
                 xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24">

                <circle class="opacity-25"
                        cx="12"
                        cy="12"
                        r="10"
                        stroke="currentColor"
                        stroke-width="4"></circle>

                <path class="opacity-75"
                      fill="currentColor"
                      d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
        </div>


        <!-- Таблиця -->
        <div id="table-wrapper"
             class="hidden bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">

            <div class="overflow-x-auto">

                <table class="w-full min-w-[1000px]">

                    <thead class="bg-slate-100 dark:bg-slate-700 text-left text-sm uppercase">
                        <tr>
                            <th class="px-4 py-4">Працівник</th>
                            <th class="px-4 py-4">Дата</th>
                            <th class="px-4 py-4">Тип зміни</th>
                            <th class="px-4 py-4">Коментар</th>
                            <th class="px-4 py-4">Статус</th>
                            <th class="px-4 py-4 text-center">Дії</th>
                        </tr>
                    </thead>

                    <tbody id="requests-table"></tbody>
                </table>
            </div>
        </div>
    </main>


<script>

// Оновлено URL скрипта
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzUEMuGcphMyNskE_DD8fJU0RBJGhYLSyNcb8CIv2nsWrQ_rEOYfsECCuu0RG1by67CIA/exec';

let allRequests = [];


// Перевірка авторизації
if (sessionStorage.getItem('admin_auth') !== 'true') {
    try {
        window.location.href = 'index.html';
    } catch (e) {
        // Обробка для середовищ (sandbox), де недоступні відносні URL
        document.body.innerHTML = `
            <div class="min-h-screen flex items-center justify-center p-4 bg-slate-50 dark:bg-slate-900">
                <div class="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-xl text-center max-w-sm w-full border border-slate-200 dark:border-slate-700">
                    <h2 class="text-xl font-bold mb-2 text-slate-800 dark:text-white">Помилка доступу</h2>
                    <p class="text-slate-500 dark:text-slate-400 mb-6">Авторизуйтесь на головній сторінці.</p>
                </div>
            </div>`;
    }
}


// Темна тема
const themeBtn = document.getElementById('theme-toggle');

themeBtn?.addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');

    localStorage.setItem(
        'color-theme',
        document.documentElement.classList.contains('dark')
            ? 'dark'
            : 'light'
    );
});


// Вихід
const logoutBtn = document.getElementById('logout-btn');

logoutBtn?.addEventListener('click', () => {
    sessionStorage.removeItem('admin_auth');
    try {
        window.location.href = 'index.html';
    } catch (e) {
        document.body.innerHTML = `
            <div class="min-h-screen flex items-center justify-center p-4 bg-slate-50 dark:bg-slate-900">
                <div class="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-xl text-center max-w-sm w-full border border-slate-200 dark:border-slate-700">
                    <h2 class="text-xl font-bold mb-2 text-slate-800 dark:text-white">Вихід виконано</h2>
                    <p class="text-slate-500 dark:text-slate-400 mb-6">Оновіть сторінку або перейдіть на головну сторінку.</p>
                </div>
            </div>`;
    }
});


// Завантаження заявок
async function loadRequests() {

    const loading = document.getElementById('loading');
    const tableWrapper = document.getElementById('table-wrapper');

    if (!loading || !tableWrapper) return; // Уникнення помилки, якщо DOM очищено

    loading.classList.remove('hidden');
    tableWrapper.classList.add('hidden');

    try {

        const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'text/plain;charset=utf-8' // Виправлено для вирішення проблеми CORS
            },
            body: JSON.stringify({
                requestType: 'get_requests'
            })
        });

        const data = await response.json();

        allRequests = Array.isArray(data)
            ? data
            : [];

        renderRequests(allRequests);
        updateStats(allRequests);

        loading.classList.add('hidden');
        tableWrapper.classList.remove('hidden');

    } catch (error) {

        console.error(error);

        loading.innerHTML = `
            <div class="text-center text-red-500">
                <p class="text-lg font-bold mb-2">Помилка завантаження</p>
                <p>Не вдалося отримати заявки. Перевірте підключення або лог консолі.</p>
            </div>
        `;
    }
}


// Рендер таблиці
function renderRequests(requests) {

    const table = document.getElementById('requests-table');
    if (!table) return;

    if (!requests.length) {

        table.innerHTML = `
            <tr>
                <td colspan="6" class="text-center py-10 text-slate-500">
                    Заявок немає
                </td>
            </tr>
        `;

        return;
    }


    table.innerHTML = requests.map((request, index) => {

        let badgeClass = 'bg-amber-100 text-amber-700';

        if (request.status === 'Погоджено' || request.status === 'Схвалено') {
            badgeClass = 'bg-emerald-100 text-emerald-700';
        }

        if (request.status === 'Відхилено') {
            badgeClass = 'bg-red-100 text-red-700';
        }


        return `
            <tr class="border-t border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/40 transition-colors">

                <td class="px-4 py-4 font-medium">
                    ${request.user || '-'}
                </td>

                <td class="px-4 py-4">
                    ${request.date || '-'}
                </td>

                <td class="px-4 py-4">
                    ${request.type || '-'}
                </td>

                <td class="px-4 py-4 max-w-[250px] break-words text-sm text-slate-500 dark:text-slate-300">
                    ${request.comment || '-'}
                </td>

                <td class="px-4 py-4">
                    <span class="px-3 py-1 rounded-lg text-sm font-bold ${badgeClass}">
                        ${request.status || 'Очікує'}
                    </span>
                </td>

                <td class="px-4 py-4">

                    <div class="flex gap-2 justify-center">

                        <button
                            onclick="updateStatus(${index}, 'Погоджено')"
                            class="px-3 py-2 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-medium transition-colors">
                            ✓
                        </button>

                        <button
                            onclick="updateStatus(${index}, 'Відхилено')"
                            class="px-3 py-2 rounded-lg bg-red-500 hover:bg-red-600 text-white text-sm font-medium transition-colors">
                            ✕
                        </button>
                    </div>
                </td>
            </tr>
        `;
    }).join('');
}


// Статистика
function updateStats(requests) {

    const totalCount = document.getElementById('total-count');
    const pendingCount = document.getElementById('pending-count');
    const approvedCount = document.getElementById('approved-count');
    const rejectedCount = document.getElementById('rejected-count');

    if (totalCount) totalCount.textContent = requests.length;

    if (pendingCount) pendingCount.textContent =
        requests.filter(r => r.status.includes('Очікує')).length;

    if (approvedCount) approvedCount.textContent =
        requests.filter(r => r.status === 'Погоджено' || r.status === 'Схвалено').length;

    if (rejectedCount) rejectedCount.textContent =
        requests.filter(r => r.status === 'Відхилено').length;
}


// Зміна статусу
async function updateStatus(index, status) {

    const request = allRequests[index];

    if (!request) return;

    try {

        await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'text/plain;charset=utf-8' // Виправлено для вирішення проблеми CORS
            },
            body: JSON.stringify({
                requestType: 'update_request_status',
                id: request.id,
                status: status
            })
        });

        request.status = status;

        renderRequests(allRequests);
        updateStats(allRequests);

    } catch (error) {

        console.error(error);

        alert('Помилка оновлення статусу');
    }
}


// Фільтрація
function applyFilters() {

    const searchInput = document.getElementById('search-input');
    const statusFilter = document.getElementById('status-filter');

    if (!searchInput || !statusFilter) return;

    const search = searchInput.value.toLowerCase();
    const status = statusFilter.value;


    const filtered = allRequests.filter(request => {

        const matchSearch =
            (request.user || '')
            .toLowerCase()
            .includes(search);

        let reqStatus = request.status || 'Очікує';
        if (reqStatus.includes('Очікує')) reqStatus = 'Очікує';
        if (reqStatus === 'Схвалено') reqStatus = 'Погоджено';

        const matchStatus =
            status === 'all'
            ? true
            : reqStatus === status;

        return matchSearch && matchStatus;
    });


    renderRequests(filtered);
}


// Події

document
    .getElementById('refresh-btn')
    ?.addEventListener('click', loadRequests);


document
    .getElementById('search-input')
    ?.addEventListener('input', applyFilters);


document
    .getElementById('status-filter')
    ?.addEventListener('change', applyFilters);


// Автооновлення кожні 60 секунд та Старт (Тільки якщо авторизований)
if (sessionStorage.getItem('admin_auth') === 'true') {
    setInterval(loadRequests, 60000);
    loadRequests();
}

</script>

</body>
</html>
