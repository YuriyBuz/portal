<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ADMIN PANEL</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#f1f5f9;
      color:#0f172a;
      padding:20px;
    }

    .container{
      max-width:1400px;
      margin:auto;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
      gap:15px;
      flex-wrap:wrap;
    }

    .title{
      font-size:28px;
      font-weight:700;
    }

    .month-select{
      padding:10px 14px;
      border-radius:10px;
      border:1px solid #cbd5e1;
      font-size:16px;
      background:white;
      cursor:pointer;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
      gap:20px;
      margin-bottom:25px;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:16px;
      box-shadow:0 2px 10px rgba(0,0,0,.05);
    }

    .card h3{
      font-size:15px;
      color:#64748b;
      margin-bottom:10px;
    }

    .card .value{
      font-size:34px;
      font-weight:700;
      color:#059669;
    }

    .section{
      background:white;
      padding:20px;
      border-radius:16px;
      box-shadow:0 2px 10px rgba(0,0,0,.05);
      margin-bottom:25px;
      overflow:auto;
    }

    .section-title{
      font-size:22px;
      font-weight:700;
      margin-bottom:20px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:900px;
    }

    th{
      background:#0f172a;
      color:white;
      padding:14px;
      text-align:left;
      font-size:14px;
    }

    td{
      padding:14px;
      border-bottom:1px solid #e2e8f0;
      font-size:14px;
    }

    tr:hover{
      background:#f8fafc;
    }

    .btn{
      border:none;
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      color:white;
      font-weight:600;
      transition:.2s;
    }

    .btn:hover{
      transform:translateY(-1px);
    }

    .approve{
      background:#059669;
    }

    .reject{
      background:#dc2626;
    }

    .status{
      padding:6px 12px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
      display:inline-block;
    }

    .pending{
      background:#fef3c7;
      color:#92400e;
    }

    .approved{
      background:#dcfce7;
      color:#166534;
    }

    .rejected{
      background:#fee2e2;
      color:#991b1b;
    }

    .loader{
      text-align:center;
      padding:50px;
      color:#64748b;
      font-size:18px;
    }

    @media(max-width:768px){
      .title{
        font-size:22px;
      }

      .card .value{
        font-size:26px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="topbar">
    <div class="title">ADMIN PANEL</div>

    <select id="monthSelect" class="month-select"></select>
  </div>

  <div class="cards">

    <div class="card">
      <h3>Працівників</h3>
      <div class="value" id="employeesCount">0</div>
    </div>

    <div class="card">
      <h3>Відпрацьовано змін</h3>
      <div class="value" id="workedCount">0</div>
    </div>

    <div class="card">
      <h3>Лікарняні</h3>
      <div class="value" id="sickCount">0</div>
    </div>

    <div class="card">
      <h3>Відпустки</h3>
      <div class="value" id="vacCount">0</div>
    </div>

  </div>

  <div class="section">

    <div class="section-title">
      Статистика працівників
    </div>

    <div id="statsTableContainer">
      <div class="loader">Завантаження...</div>
    </div>

  </div>

  <div class="section">

    <div class="section-title">
      Заявки на зміни
    </div>

    <div id="requestsTableContainer">
      <div class="loader">Завантаження...</div>
    </div>

  </div>

</div>

<script>

const WEB_APP_URL =
'https://script.google.com/macros/s/AKfycbyvtbq2U1aCVB1H2SbZGJHBZRX2FAYSz-s0OOSJJ_tYQFU_2vgTBnliLyPedZQga19EBg/exec';

const ukrMonths = [
  'Січень',
  'Лютий',
  'Березень',
  'Квітень',
  'Травень',
  'Червень',
  'Липень',
  'Серпень',
  'Вересень',
  'Жовтень',
  'Листопад',
  'Грудень'
];

function generateMonths() {

  const select = document.getElementById('monthSelect');

  const now = new Date();

  for(let i = -6; i <= 6; i++){

    const d = new Date(now.getFullYear(), now.getMonth() + i, 1);

    const label =
      ukrMonths[d.getMonth()] + ' ' + d.getFullYear();

    const option = document.createElement('option');

    option.value = label;
    option.textContent = label;

    if(i === 0){
      option.selected = true;
    }

    select.appendChild(option);
  }

  select.addEventListener('change', () => {
    loadAdminData(select.value);
  });
}

async function loadAdminData(monthYear){

  try{

    document.getElementById('statsTableContainer').innerHTML =
      '<div class="loader">Завантаження...</div>';

    document.getElementById('requestsTableContainer').innerHTML =
      '<div class="loader">Завантаження...</div>';

    const response = await fetch(WEB_APP_URL, {
      method:'POST',
      headers:{
        'Content-Type':'application/json'
      },
      body:JSON.stringify({
        requestType:'get_admin_data',
        monthYear:monthYear
      })
    });

    const data = await response.json();

    renderStats(data.stats || []);
    renderRequests(data.requests || []);

  }catch(err){

    console.error(err);

    document.getElementById('statsTableContainer').innerHTML =
      '<div class="loader">Помилка завантаження</div>';

    document.getElementById('requestsTableContainer').innerHTML =
      '<div class="loader">Помилка завантаження</div>';
  }
}

function renderStats(stats){

  let worked = 0;
  let sick = 0;
  let vac = 0;

  stats.forEach(s => {
    worked += Number(s.worked || 0);
    sick += Number(s.sick || 0);
    vac += Number(s.vac || 0);
  });

  document.getElementById('employeesCount').textContent =
    stats.length;

  document.getElementById('workedCount').textContent =
    worked;

  document.getElementById('sickCount').textContent =
    sick;

  document.getElementById('vacCount').textContent =
    vac;

  let html = `
    <table>
      <thead>
        <tr>
          <th>Працівник</th>
          <th>Заплановано</th>
          <th>Відпрацьовано</th>
          <th>Лікарняні</th>
          <th>Відпустки</th>
          <th>Залишок відпустки</th>
        </tr>
      </thead>
      <tbody>
  `;

  stats.forEach(s => {

    html += `
      <tr>
        <td>${escapeHtml(s.name)}</td>
        <td>${s.scheduled || 0}</td>
        <td>${s.worked || 0}</td>
        <td>${s.sick || 0}</td>
        <td>${s.vac || 0}</td>
        <td>${s.vacLeft || 0}</td>
      </tr>
    `;
  });

  html += `
      </tbody>
    </table>
  `;

  document.getElementById('statsTableContainer').innerHTML =
    html;
}

function renderRequests(requests){

  if(!requests.length){

    document.getElementById('requestsTableContainer').innerHTML =
      '<div class="loader">Немає заявок</div>';

    return;
  }

  let html = `
    <table>
      <thead>
        <tr>
          <th>Дата</th>
          <th>Працівник</th>
          <th>Тип зміни</th>
          <th>Коментар</th>
          <th>Статус</th>
          <th>Дії</th>
        </tr>
      </thead>
      <tbody>
  `;

  requests.reverse().forEach(r => {

    let statusClass = 'pending';

    if(r[5] === 'Погоджено'){
      statusClass = 'approved';
    }

    if(r[5] === 'Відхилено'){
      statusClass = 'rejected';
    }

    html += `
      <tr>

        <td>${escapeHtml(r[1] || '')}</td>

        <td>${escapeHtml(r[2] || '')}</td>

        <td>${escapeHtml(r[3] || '')}</td>

        <td>${escapeHtml(r[4] || '')}</td>

        <td>
          <span class="status ${statusClass}">
            ${escapeHtml(r[5] || '')}
          </span>
        </td>

        <td>
    `;

    if(r[5] === '⏳ Очікує погодження'){

      html += `
        <button
          class="btn approve"
          onclick='updateStatus(
            "${r[0]}",
            "Погоджено",
            "${encodeURIComponent(r[1])}",
            "${encodeURIComponent(r[2])}",
            "${encodeURIComponent(r[3])}"
          )'
        >
          Погодити
        </button>

        <button
          class="btn reject"
          onclick='updateStatus(
            "${r[0]}",
            "Відхилено",
            "${encodeURIComponent(r[1])}",
            "${encodeURIComponent(r[2])}",
            "${encodeURIComponent(r[3])}"
          )'
        >
          Відхилити
        </button>
      `;
    }

    html += `
        </td>

      </tr>
    `;
  });

  html += `
      </tbody>
    </table>
  `;

  document.getElementById('requestsTableContainer').innerHTML =
    html;
}

async function updateStatus(
  requestId,
  status,
  date,
  userName,
  type
){

  try{

    const response = await fetch(WEB_APP_URL, {
      method:'POST',
      headers:{
        'Content-Type':'application/json'
      },
      body:JSON.stringify({
        requestType:'update_request_status',
        requestId:requestId,
        status:status,
        date:decodeURIComponent(date),
        userName:decodeURIComponent(userName),
        type:decodeURIComponent(type)
      })
    });

    const text = await response.text();

    if(text === 'OK'){

      alert('Статус успішно оновлено');

      loadAdminData(
        document.getElementById('monthSelect').value
      );

    }else{

      alert(text);
    }

  }catch(err){

    console.error(err);

    alert('Помилка зʼєднання');
  }
}

function escapeHtml(text){

  if(text === null || text === undefined){
    return '';
  }

  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

generateMonths();

loadAdminData(
  document.getElementById('monthSelect').value
);

</script>

</body>
</html>
