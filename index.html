<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Графік роботи | Портал працівника</title>
    <meta name="theme-color" content="#059669">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; }
    </style>
</head>
<body class="font-sans text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Верхня панель навігації -->
    <nav class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50" id="main-nav" style="display: none;">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-4">
                    <!-- Кнопка Назад із безпечним відносним шляхом -->
                    <a href="./index.html" class="text-slate-500 hover:text-emerald-600 transition-colors flex items-center gap-1 font-medium bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-100">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                        </svg>
                        <span class="hidden sm:inline">На портал</span>
                    </a>
                    <h1 class="text-lg sm:text-xl font-bold text-slate-800 flex items-center gap-2">
                        <svg class="w-6 h-6 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
                        </svg>
                        Графік роботи
                    </h1>
                </div>
                <div class="flex items-center">
                    <span id="user-greeting" class="text-emerald-700 font-medium text-sm bg-emerald-50 px-3 py-1.5 rounded-full border border-emerald-100 hidden sm:block"></span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Основний контент -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8" id="main-content" style="display: none;">
        
        <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 mb-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div>
                <h3 class="font-semibold text-blue-800">Повний графік роботи</h3>
                <p class="text-sm text-blue-600">Тут відображається актуальний стан документа з Google Таблиць.</p>
            </div>
            <!-- Кнопка для відкриття повної таблиці в новій вкладці -->
            <a href="https://docs.google.com/spreadsheets/d/1uL5lkZGPk8klJku5dX-eh075aZhFSUTeyIdDHLAQuKg/edit?gid=1460425356#gid=1460425356" target="_blank" rel="noopener noreferrer" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-4 rounded-lg transition-colors whitespace-nowrap text-sm text-center w-full sm:w-auto">
                Відкрити в новій вкладці
            </a>
        </div>

        <!-- Контейнер для вбудованої таблиці -->
        <div class="w-full rounded-xl overflow-hidden border border-slate-200 shadow-sm bg-white" style="height: 70vh; min-height: 500px;">
            <iframe src="https://docs.google.com/spreadsheets/d/1uL5lkZGPk8klJku5dX-eh075aZhFSUTeyIdDHLAQuKg/htmlembed?gid=1460425356&widget=true&headers=false" class="w-full h-full border-0"></iframe>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. БЕЗПЕКА: Перевірка авторизації
            const currentUser = sessionStorage.getItem('portal_user');
            
            // Якщо користувач не увійшов, показуємо безпечне повідомлення
            if (!currentUser) {
                document.body.innerHTML = `
                    <div class="min-h-screen flex items-center justify-center p-4 bg-slate-50">
                        <div class="bg-white p-8 rounded-2xl shadow-sm text-center max-w-md w-full border border-slate-200">
                            <svg class="w-16 h-16 text-emerald-500 mx-auto mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                            <h2 class="text-2xl font-bold text-slate-800 mb-2">Доступ закрито</h2>
                            <p class="text-slate-500 mb-8">Будь ласка, авторизуйтесь на головній сторінці порталу для перегляду графіка.</p>
                            <!-- Використано безпечний відносний шлях -->
                            <a href="./index.html" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg w-full block transition-colors shadow-sm">Перейти до входу</a>
                        </div>
                    </div>
                `;
                return;
            }

            // Якщо авторизований - показуємо контент
            document.getElementById('main-nav').style.display = 'block';
            document.getElementById('main-content').style.display = 'block';

            // Відображаємо ім'я користувача
            const greetingEl = document.getElementById('user-greeting');
            if (greetingEl) {
                greetingEl.textContent = `👤 ${currentUser}`;
                greetingEl.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
